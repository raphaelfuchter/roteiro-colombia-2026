<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b4f6c">
<link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="icon-192.png"><link rel="apple-touch-icon" href="icon-192.png"><meta name="apple-mobile-web-app-capable" content="yes"><title>Cartagena + San Andrés</title>
<style>
:root{
  --mar:#0b4f6c;--mar2:#0e6a8f;--tur:#14b8a6;--coral:#f26b5b;--sol:#f5a524;--areia:#f6ecd9;
  --bg:#f7f3ea;--card:#ffffff;--txt:#14232f;--sub:#5d6d7a;--line:#e8dfcd;--chip:#ffffff;--shadow:0 6px 24px rgba(11,79,108,.10);
}
@media (prefers-color-scheme:dark){:root{
  --bg:#0c1820;--card:#13232e;--txt:#e9f1f5;--sub:#9db0bd;--line:#1f3442;--chip:#162a36;--areia:#1d3340;--shadow:0 6px 24px rgba(0,0,0,.35);
}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--txt);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,sans-serif}
body{padding-bottom:env(safe-area-inset-bottom)}
.wrap{max-width:560px;margin:0 auto}
/* hero */
.hero{position:relative;padding:calc(18px + env(safe-area-inset-top)) 18px 54px;color:#fff;
  background:radial-gradient(120% 140% at 0% 0%,#14b8a6 0%,#0e6a8f 45%,#0b4f6c 100%);overflow:hidden}
.hero:after{content:"";position:absolute;left:-10%;right:-10%;bottom:-30px;height:70px;background:var(--bg);border-radius:50% 50% 0 0/100% 100% 0 0}
.hero small{opacity:.85;font-weight:600;letter-spacing:.08em;text-transform:uppercase;font-size:11px}
.hero h1{margin:4px 0 2px;font-size:28px;letter-spacing:-.02em;line-height:1.1}
.hero p{margin:0;opacity:.9;font-size:14px}
.sun{position:absolute;right:-30px;top:-30px;width:140px;height:140px;border-radius:50%;background:radial-gradient(circle,#ffd27a 0,#f5a52455 45%,transparent 70%)}
/* sticky nav */
.nav{position:sticky;top:0;z-index:10;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);padding:8px 0 10px;margin-top:-34px}
.seg{display:flex;margin:0 16px;background:var(--chip);border-radius:14px;padding:4px;box-shadow:var(--shadow)}
.seg button{flex:1;border:0;background:none;color:var(--sub);font-family:inherit;font-weight:600;font-size:15px;padding:11px 6px;border-radius:10px;transition:.2s}
.seg button.on{background:var(--mar);color:#fff}
.chips{display:flex;gap:8px;overflow-x:auto;padding:12px 16px 2px;scroll-snap-type:x mandatory;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{scroll-snap-align:start;flex:0 0 auto;min-width:58px;border:1px solid var(--line);background:var(--chip);color:var(--txt);border-radius:16px;padding:8px 10px;text-align:center;font-family:inherit;position:relative}
.chip b{display:block;font-size:20px;line-height:1.1}
.chip span{font-size:11px;color:var(--sub);text-transform:uppercase;letter-spacing:.05em;font-weight:600}
.chip.on{background:var(--coral);border-color:var(--coral);color:#fff}.chip.on span{color:#fff}
.chip .today{position:absolute;top:-6px;right:-4px;background:var(--sol);color:#fff;font-size:9px;font-weight:800;padding:2px 5px;border-radius:8px;letter-spacing:.04em}
.chip.x b{font-size:18px}
/* day */
main{padding:6px 16px 28px}
.dayhead{margin:12px 2px 10px}
.dayhead small{color:var(--coral);font-weight:700;font-size:12px;letter-spacing:.06em;text-transform:uppercase}
.dayhead h2{margin:2px 0 0;font-size:24px;letter-spacing:-.02em}
.notes{display:flex;gap:8px;overflow-x:auto;margin:0 -16px 6px;padding:4px 16px 8px;scrollbar-width:none}
.notes::-webkit-scrollbar{display:none}
.note{flex:0 0 auto;max-width:78%;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:8px 12px;font-size:13px;display:flex;gap:8px;align-items:flex-start}
.note i{font-style:normal;font-size:18px}.note div b{display:block;font-size:13px}.note div span{color:var(--sub);font-size:12px}
/* timeline */
.tl{position:relative;margin-top:6px}
.tl:before{content:"";position:absolute;left:21px;top:8px;bottom:8px;width:2px;background:linear-gradient(var(--tur),var(--coral));opacity:.35;border-radius:2px}
.item{display:grid;grid-template-columns:44px 1fr;gap:10px;margin-bottom:16px;animation:in .35s ease both}
@keyframes in{from{opacity:0;transform:translateY(8px)}}
.dot{width:44px;display:flex;flex-direction:column;align-items:center;gap:4px;padding-top:6px}
.dot i{font-style:normal;width:34px;height:34px;border-radius:50%;display:grid;place-items:center;background:var(--card);box-shadow:var(--shadow);font-size:17px;position:relative;z-index:1}
.dot b{font-size:11px;color:var(--sub);font-weight:700}
.card{background:var(--card);border-radius:20px;overflow:hidden;box-shadow:var(--shadow)}
.car{position:relative}
.slides{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none}
.slides::-webkit-scrollbar{display:none}
.slides img{flex:0 0 100%;width:100%;aspect-ratio:16/10;object-fit:cover;scroll-snap-align:center;display:block}
.dots{position:absolute;bottom:8px;left:0;right:0;display:flex;justify-content:center;gap:5px}
.dots span{width:6px;height:6px;border-radius:3px;background:#fff8;transition:.2s}.dots span.on{width:16px;background:#fff}
.lbl{position:absolute;top:10px;left:10px;font-size:10px;font-weight:700;color:#fff;background:#0008;padding:3px 7px;border-radius:8px;backdrop-filter:blur(4px)}
.typ{position:absolute;top:10px;right:10px;font-size:11px;font-weight:800;color:#fff;padding:4px 9px;border-radius:10px;text-transform:uppercase;letter-spacing:.04em}
.bd{padding:12px 14px 14px}
.bd h3{margin:0;font-size:19px;letter-spacing:-.01em}
.cz{color:var(--sub);font-size:13px;margin-top:2px}
.row{display:flex;justify-content:space-between;align-items:center;margin:10px 0 8px;font-size:13px}
.stars{color:#f5b301;letter-spacing:1px}.stars .e{color:var(--line)}
.na{color:var(--sub);font-style:italic}
.pr b{color:var(--tur);letter-spacing:1px}.pr span{color:var(--line);letter-spacing:1px}
.dish{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0 10px}
.dish span{font-size:12.5px;background:var(--areia);border-radius:999px;padding:5px 10px}
.tip{font-size:13px;line-height:1.4;padding:9px 11px;border-radius:12px;background:color-mix(in srgb,var(--sol) 14%,transparent);border-left:3px solid var(--sol)}
.act{display:flex;gap:8px;margin-top:12px}
.act a{flex:1;text-align:center;text-decoration:none;font-weight:700;font-size:14px;padding:11px;border-radius:12px;background:var(--mar);color:#fff}
.act a.ig{background:linear-gradient(45deg,#f09433,#dc2743 50%,#bc1888);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mini{display:grid;grid-template-columns:44px 1fr;gap:10px;margin-bottom:14px}
.mini .card{padding:12px 14px;display:flex;gap:10px;align-items:center;border:1.5px dashed var(--line);box-shadow:none;background:transparent}
.mini .card b{display:block;font-size:14px}.mini .card span{font-size:12px;color:var(--sub)}
.how{font-size:13px;line-height:1.45;padding:9px 11px;border-radius:12px;margin-top:10px;background:color-mix(in srgb,#7c5cbf 12%,transparent);border-left:3px solid #7c5cbf}.how b{display:block;font-size:12px;text-transform:uppercase;letter-spacing:.05em;color:#7c5cbf;margin-bottom:2px}
.act-c .slides img{aspect-ratio:16/8}
/* extras */
.ex{display:grid;gap:12px}
.ex .card{padding:14px}
/* pager */
.pager{display:flex;gap:10px;margin-top:8px}
.pager button{flex:1;border:1px solid var(--line);background:var(--card);color:var(--txt);font-family:inherit;font-weight:600;font-size:14px;padding:12px;border-radius:14px}
.pager button:disabled{opacity:.35}
.foot{color:var(--sub);font-size:11px;line-height:1.5;margin-top:22px}
</style>
</head>
<body>
<div class="wrap">
  <header class="hero"><div class="sun"></div>
    <small>Colômbia · 11 → 17 nov 2026</small>
    <h1>Cartagena + San Andrés</h1>
    <p>Roteiro gastronômico · 18 paradas, nenhum lugar repetido</p>
  </header>
  <nav class="nav">
    <div class="seg" id="seg"></div>
    <div class="chips" id="chips"></div>
  </nav>
  <main id="main"></main>
</div>
<script>
const D=/*DATA*/;
const TYPE={'Almoço':['🍽️','#14b8a6'],'Café da tarde':['☕','#d99a2b'],'Pôr do sol':['🌅','#e8743b'],'Jantar':['🌙','#0b4f6c']};
const WD={Qua:'Quarta',Qui:'Quinta',Sex:'Sexta','Sáb':'Sábado',Dom:'Domingo',Seg:'Segunda',Ter:'Terça'};
const pad=n=>String(n).padStart(2,'0');const now=new Date();
const TODAY=`${now.getFullYear()}-${pad(now.getMonth()+1)}-${pad(now.getDate())}`;
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let state={city:'ctg',sel:null};

function stars(r,c,s){if(r==null)return `<span class=na>sem nota online${c?' · '+esc(c)+' aval.':''}</span>`;
  const n=Math.floor(r+.25);return `<span class=stars>${'★'.repeat(n)}<span class=e>${'★'.repeat(5-n)}</span></span> <b>${r.toFixed(1).replace('.',',')}</b> <span class=na style="font-style:normal">${c?esc(c)+' · ':''}${esc(s)}</span>`}
const price=p=>`<span class=pr><b>${'$'.repeat(p)}</b><span>${'$'.repeat(4-p)}</span></span>`;

function card(m){
  const [ic,col]=TYPE[m.type];
  const allIg=m.photos.every(p=>p.ig),anyIg=m.photos.some(p=>p.ig);
  const lbl=allIg?'📸 Instagram oficial':anyIg?'📸 Instagram + ilustrativa':'Foto ilustrativa';
  return `<div class=item><div class=dot><i>${ic}</i><b>${m.time}</b></div><div class=card>
  <div class=car><div class=slides>${m.photos.map(p=>`<img loading=lazy alt="" src="${p.s}">`).join('')}</div>
  ${m.photos.length>1?`<div class=dots>${m.photos.map((_,i)=>`<span class="${i?'':'on'}"></span>`).join('')}</div>`:''}
  <span class=lbl>${lbl}</span><span class=typ style="background:${col}">${m.type}</span></div>
  <div class=bd><h3>${esc(m.name)}</h3><div class=cz>${esc(m.cuisine)}</div>
  <div class=row><div>${stars(m.rating,m.count,m.src)}</div>${price(m.price)}</div>
  <div class=dish>${m.dishes.map(d=>`<span>${esc(d)}</span>`).join('')}</div>
  <div class=tip>💡 ${esc(m.tip)}</div>
  <div class=act><a href="${m.maps}" target=_blank rel=noopener>📍 Maps</a>${m.ig?`<a class=ig href="https://www.instagram.com/${m.ig}/" target=_blank rel=noopener>📸 @${esc(m.ig)}</a>`:''}</div></div></div></div>`}

function actCard(a){
  return `<div class=item><div class=dot><i>${a.icon}</i><b>${a.time}</b></div><div class="card act-c">
  <div class=car><div class=slides><img loading=lazy alt="" src="${a.photo}"></div><span class=lbl>Foto ilustrativa</span><span class=typ style="background:#7c5cbf">Passeio</span></div>
  <div class=bd><h3>${esc(a.name)}</h3><div class=cz style="margin-top:6px;font-size:14px;line-height:1.45;color:var(--txt)">${esc(a.desc)}</div>
  <div class=how><b>🚗 Como chegar</b>${esc(a.how)}</div>
  <div class=act><a href="${a.maps}" target=_blank rel=noopener>📍 Abrir no Maps</a></div></div></div></div>`}
function renderNav(){
  document.getElementById('seg').innerHTML=Object.entries(D.city).map(([k,[n,e]])=>`<button class="${k==state.city?'on':''}" data-c="${k}">${e} ${n}</button>`).join('');
  const ds=D.days.filter(d=>d.city==state.city);
  document.getElementById('chips').innerHTML=ds.map(d=>`<button class="chip ${d.iso==state.sel?'on':''}" data-d="${d.iso}">${d.iso==TODAY?'<em class=today>HOJE</em>':''}<span>${d.wd}</span><b>${d.dd}</b></button>`).join('')
   +`<button class="chip x ${state.sel=='x-'+state.city?'on':''}" data-d="x-${state.city}"><span>Extras</span><b>✨</b></button>`;
  document.querySelector('.chip.on')?.scrollIntoView({inline:'center',block:'nearest'});
}
function renderDay(){
  const main=document.getElementById('main');
  if(state.sel.startsWith('x-')){
    const c=state.sel.slice(2);
    main.innerHTML=`<div class=dayhead><small>${D.city[c][0]}</small><h2>Se bater vontade</h2></div><div class=ex>`+
      D.extras[c].map(e=>`<div class=card><h3 style="margin:0;font-size:18px">${esc(e.name)}</h3><div class=cz>${esc(e.cuisine)}</div>
      <div class=row><div>${stars(e.rating,e.count,e.src)}</div>${price(e.price)}</div><div class=tip>💡 ${esc(e.tip)}</div>
      <div class=act><a href="${e.maps}" target=_blank rel=noopener>📍 Abrir no Maps</a></div></div>`).join('')+`</div>`+pager()+foot();
  }else{
    const d=D.days.find(x=>x.iso==state.sel),ms=D.meals.filter(m=>m.day==d.iso);
    main.innerHTML=`<div class=dayhead><small>${D.city[d.city][1]} ${D.city[d.city][0]}${d.iso==TODAY?' · hoje':''}</small><h2>${WD[d.wd]}, ${d.dd} de novembro</h2><div class=cz style="font-size:14px">${esc(d.title)}</div></div>`
     +(d.notes.length?`<div class=notes>${d.notes.map(([i,t,s])=>`<div class=note><i>${i}</i><div><b>${esc(t)}</b>${s?`<span>${esc(s)}</span>`:''}</div></div>`).join('')}</div>`:'')
     +`<div class=tl>`+(d.wd=='Sáb'?`<div class=mini><div class=dot><i>✈️</i></div><div class=card><div><b>Almoço no avião</b><span>Cartagena → San Andrés</span></div></div></div>`:'')
     +[...ms.map(m=>({t:m.time,h:card(m)})),...D.acts.filter(a=>a.day==d.iso).map(a=>({t:a.time,h:actCard(a)}))].sort((x,y)=>x.t<y.t?-1:x.t>y.t?1:0).map(x=>x.h).join('')+`</div>`+pager()+foot();
  }
  main.querySelectorAll('.car').forEach(c=>{const s=c.querySelector('.slides'),dots=c.querySelectorAll('.dots span');
    s.addEventListener('scroll',()=>{const i=Math.round(s.scrollLeft/s.clientWidth);dots.forEach((d,j)=>d.classList.toggle('on',i==j))},{passive:true})});
}
function order(){return D.days.map(d=>d.iso).flatMap((iso,i,a)=>{const c=D.days[i].city;return (i==a.length-1||D.days[i+1].city!=c)?[iso,'x-'+c]:[iso]})}
function pager(){const o=order(),i=o.indexOf(state.sel);return `<div class=pager><button data-go="${o[i-1]||''}" ${i?'':'disabled'}>← Anterior</button><button data-go="${o[i+1]||''}" ${i<o.length-1?'':'disabled'}>Próximo →</button></div>`}
const foot=()=>`<div class=foot>Notas: Google Maps/Tripadvisor, consultadas em nov/2026. Fotos “Instagram oficial” vêm do perfil do próprio lugar; “ilustrativa” vem do Wikimedia Commons (prato semelhante ou foto do local). Tempos de deslocamento são estimativas. Horários podem mudar: confirme no Maps.</div>`;
function go(sel,push=true){state.sel=sel;state.city=sel.startsWith('x-')?sel.slice(2):D.days.find(d=>d.iso==sel).city;
  renderNav();renderDay();if(push)history.replaceState(null,'','#'+sel);window.scrollTo({top:0,behavior:'smooth'})}
document.addEventListener('click',e=>{const b=e.target.closest('[data-c],[data-d],[data-go]');if(!b)return;
  if(b.dataset.c){go(D.days.find(d=>d.city==b.dataset.c).iso)}else go(b.dataset.d||b.dataset.go)});
const h=decodeURIComponent(location.hash.slice(1));
go(order().includes(h)?h:(D.days.some(d=>d.iso==TODAY)?TODAY:D.days[0].iso),false);
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js');
</script>
</body>
</html>
